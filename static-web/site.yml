---
# Play 1: Install and configure Nginx
- name: Install and start Nginx on web servers
  hosts: web
  become: yes
  tasks:
    - name: Ensure APT cache is updated
      apt:
        update_cache: yes

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Ensure Nginx is running and enabled
      service:
        name: nginx
        state: started
        enabled: yes

# Play 2: Deploy static web content
- name: Deploy index.html to web root
  hosts: web
  become: yes
  tasks:
    - name: Copy index.html from controller to web server
      copy:
        src: files/index.html
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'

# Play 3: Verify the deployment
- name: Verify website availability
  hosts: web
  tasks:
    - name: Check HTTP response
      uri:
        url: http://{{ ansible_host }}
        return_content: yes
      register: web_response

    - name: Show a short content snippet
      debug:
        msg: "{{ web_response.content | truncate(100) }}"